services:
  db:
    image: timescale/timescaledb:latest-pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      MODEL_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/models:ro
    depends_on:
      db:
        condition: service_healthy

  # HTTPS pred API a frontendom: docker compose --profile tls up -d --build
  web:
    profiles: ["tls"]
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
